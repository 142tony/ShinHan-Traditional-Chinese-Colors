<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShinHan 專家國畫顏料 - 完整色卡系統</title>
    <style>
        :root {
            /* --- [關鍵設定] 雪碧圖參數 (ShinHan) --- */
            --sprite-cols: 3;    /* 橫向 3 格 */
            --sprite-rows: 7;    /* 縱向 7 格 */
            
            /* --- 卡片視覺設定 --- */
            --bg-color: #f4f7f6;
            --primary-color: #2c3e50;
            --card-radius: 12px;
            --swatch-ratio: 4 / 1; /* 維持 ShinHan 色塊寬扁比例 (400x100) */
            --zoom-tolerance: 1.02; /* 2% 放大容錯，消除白邊 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            color: #2c3e50;
        }
        
        p {
            color: #7f8c8d;
            margin: 0;
        }

        .search-wrapper {
            position: relative;
            max-width: 600px;
            margin: 25px auto 0;
        }

        #searchInput {
            width: 100%;
            padding: 15px 25px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background: #fafafa;
        }

        #searchInput:focus {
            border-color: #3498db;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        }

        /* --- Grid Layout --- */
        .color-grid {
            display: grid;
            /* 電腦版：自動填滿，每張卡片最小 280px (確保寬扁色塊好看) */
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* --- Card Component --- */
        .card {
            background: white;
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }

        /* --- Swatch (Visual) --- */
        .swatch {
            width: 100%;
            aspect-ratio: var(--swatch-ratio); /* 鎖定 4:1 比例 */
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid #eee;
            background-color: #eee; /* Loading placeholder */
        }

        /* 使用偽元素顯示圖片，支援 CSS Variable 定位 */
        .swatch::before {
            content: '';
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('新韓 國畫顏料.jpg');
            background-repeat: no-repeat;
            
            /* 雪碧圖尺寸計算：Grid Cols * 100%, Grid Rows * 100% */
            background-size: calc(var(--sprite-cols) * 100%) calc(var(--sprite-rows) * 100%);
            
            /* 由 JS 傳入的變數控制位置 */
            background-position: var(--bg-x) var(--bg-y);
            
            /* 放大容錯與中心點 */
            transform: scale(var(--zoom-tolerance));
            transform-origin: center center;
        }

        /* --- Info Section --- */
        .info {
            padding: 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .color-id {
            font-size: 1.4em;
            font-weight: 800;
            color: #2c3e50;
            letter-spacing: -0.5px;
        }

        .group-badge {
            font-size: 0.75em;
            background: #ecf0f1;
            padding: 4px 8px;
            border-radius: 6px;
            color: #7f8c8d;
            font-weight: 700;
            text-transform: uppercase;
        }

        .name-container {
            display: flex;
            flex-direction: column;
        }

        .name-en {
            font-weight: 700;
            font-size: 1.1em;
            color: #34495e;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .name-zh {
            font-size: 1em;
            color: #95a5a6;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            font-weight: 500;
        }

        .no-result {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: #bdc3c7;
            font-size: 1.2em;
        }

        /* --- Mobile Responsive (< 768px) --- */
        @media (max-width: 768px) {
            body { padding: 10px; }
            
            header { 
                padding: 20px 15px; 
                margin-bottom: 20px;
            }
            
            h1 { font-size: 1.4rem; }

            .color-grid {
                /* 手機版強制 2 欄，間距縮小 */
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .info { padding: 12px; }
            .color-id { font-size: 1.2em; }
            .group-badge { font-size: 0.65em; padding: 2px 6px; }
            .name-en { font-size: 0.95em; }
            .name-zh { font-size: 0.85em; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ShinHan 專家國畫顏料</h1>
        <p>完整色號資料庫</p>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="搜尋色號 (314)、名稱 (Crimson) 或中文 (臙脂)...">
        </div>
    </header>

    <main id="gridContainer" class="color-grid"></main>
</div>

<script>
    // Config: 依照 ShinHan 圖片設定
    const SPRITE_COLS = 3;
    const SPRITE_ROWS = 7;

    // Data Source
    const colorData = [
        // 第一排 (Row 0)
        { id: '314', en: 'CRIMSON 1', zh: '臙脂', group: 'C', spriteIndex: 0 },
        { id: '306', en: 'GREEN LIGHT', zh: '若葉', group: 'B', spriteIndex: 1 },
        { id: '328', en: 'RED VIOLET', zh: '牡丹', group: 'D', spriteIndex: 2 },
        // 第二排 (Row 1)
        { id: '309', en: 'CRIMSON 2', zh: '臙脂', group: 'C', spriteIndex: 3 },
        { id: '316', en: 'DARK GREEN', zh: '綠草', group: 'B', spriteIndex: 4 },
        { id: '304', en: 'YELLOW OCHRE', zh: '黃土', group: 'B', spriteIndex: 5 },
        // 第三排 (Row 2)
        { id: '339', en: 'CARMINE', zh: '洋紅', group: 'C', spriteIndex: 6 },
        { id: '307', en: 'ICE GREEN', zh: '綠青', group: 'B', spriteIndex: 7 },
        { id: '303', en: 'BURNT SIENNA', zh: '岱赭', group: 'B', spriteIndex: 8 },
        // 第四排 (Row 3)
        { id: '310', en: 'RED', zh: '洋紅', group: 'A', spriteIndex: 9 },
        { id: '315', en: 'LIGHT BLUE VIOLET', zh: '群白', group: 'A', spriteIndex: 10 },
        { id: '302', en: 'BLACK 1', zh: '黑', group: 'B', spriteIndex: 11 },
        // 第五排 (Row 4)
        { id: '311', en: 'VERMILION', zh: '朱紅', group: 'C', spriteIndex: 12 },
        { id: '312', en: 'ULTRAMARINE BLUE', zh: '群青', group: 'C', spriteIndex: 13 },
        { id: '301', en: 'WHITE', zh: '胡粉', group: 'A', spriteIndex: 14 },
        // 第六排 (Row 5)
        { id: '305', en: 'YELLOW LIGHT', zh: '黃', group: 'B', spriteIndex: 15 },
        { id: '313', en: 'PRUSSIAN BLUE', zh: '紺', group: 'A', spriteIndex: 16 },
        { id: '350', en: 'GOLD', zh: '金', group: 'B', spriteIndex: 17 },
        // 第七排 (Row 6)
        { id: '308', en: 'OPAL GREEN', zh: '白綠', group: 'B', spriteIndex: 18 },
        { id: '327', en: 'VIOLET', zh: '青紫', group: 'D', spriteIndex: 19 }
    ];

    const gridContainer = document.getElementById('gridContainer');
    const searchInput = document.getElementById('searchInput');

    // Helper: Compute Sprite CSS Variables
    // 這裡我們將 JS 計算邏輯轉換為 CSS Variable，讓 ::before 使用
    const getSpriteStyle = (index) => {
        const row = Math.floor(index / SPRITE_COLS);
        const col = index % SPRITE_COLS;
        
        // CSS Sprite Percentage Formula
        const xPos = (col / (SPRITE_COLS - 1)) * 100;
        const yPos = (row / (SPRITE_ROWS - 1)) * 100;

        return `--bg-x: ${xPos}%; --bg-y: ${yPos}%;`;
    };

    // Helper: Escape HTML to prevent XSS
    const escapeHTML = (str) => str.replace(/[&<>"']/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[tag]));

    // Render Logic
    const renderList = (data) => {
        if (!gridContainer) return;

        gridContainer.innerHTML = '';

        if (data.length === 0) {
            gridContainer.innerHTML = '<div class="no-result">沒有找到符合的顏料</div>';
            return;
        }

        const fragment = document.createDocumentFragment();

        data.forEach(color => {
            const card = document.createElement('article');
            card.className = 'card';

            // 將計算好的 CSS 變數應用在 swatch 上，讓 CSS ::before 讀取
            card.innerHTML = `
                <div class="swatch" style="${getSpriteStyle(color.spriteIndex)}"></div>
                <div class="info">
                    <div class="header-row">
                        <span class="color-id">${escapeHTML(color.id)}</span>
                        <span class="group-badge">Group ${escapeHTML(color.group)}</span>
                    </div>
                    <div class="name-container">
                        <div class="name-en">${escapeHTML(color.en)}</div>
                        <div class="name-zh">${escapeHTML(color.zh)}</div>
                    </div>
                </div>
            `;
            fragment.appendChild(card);
        });

        gridContainer.appendChild(fragment);
    };

    // Search Handler
    const handleSearch = (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = colorData.filter(item => 
            item.id.includes(query) || 
            item.en.toLowerCase().includes(query) || 
            item.zh.includes(query)
        );
        renderList(filtered);
    };

    // Init
    document.addEventListener('DOMContentLoaded', () => {
        renderList(colorData);
        searchInput.addEventListener('input', handleSearch);
    });
</script>

</body>
</html>
