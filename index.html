<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShinHan 國畫顏料色卡表 - 響應式雙欄版</title>
    <style>
        /* --- CSS Reset & Variables --- */
        :root {
            --bg-color: #f0f2f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --accent-color: #333;
            --container-width: 1280px; 
            --card-width: 400px; 
            --gap-size: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Header Section --- */
        header {
            width: 100%;
            max-width: var(--container-width);
            margin-bottom: 30px;
            background: #ffffff;
            padding: 24px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            padding-left: 44px;
            border: 2px solid #eaecf0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            background-color: #fff;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(0,0,0,0.05);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            border: 2px solid #98a2b3;
            border-radius: 50%;
        }
        .search-icon::after {
            content: '';
            position: absolute;
            top: 11px;
            left: 11px;
            width: 6px;
            height: 2px;
            background: #98a2b3;
            transform: rotate(45deg);
        }

        /* --- Grid Layout --- */
        main {
            width: 100%;
            max-width: var(--container-width);
        }

        .color-grid {
            display: grid;
            /* 預設桌面版：3欄固定寬度 */
            grid-template-columns: repeat(3, var(--card-width)); 
            gap: var(--gap-size);
            justify-content: center;
        }

        /* --- Color Card Component --- */
        .color-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column; 
            /* 讓卡片在Grid中自動填滿高度，確保同一列卡片等高 */
            height: 100%;
        }

        .color-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }

        /* 上半部：雪碧圖顯示區 (核心修改) */
        .card-visual {
            width: 100%;
            /* 使用 aspect-ratio 鎖定 4:1 比例 (400px:100px) */
            aspect-ratio: 4 / 1; 
            background-image: url('新韓 國畫顏料.jpg');
            background-repeat: no-repeat;
            
            /* 雪碧圖總寬是單格的3倍，總高是單格的7倍。
               設定百分比後，無論容器寬度為何，圖片都會等比例縮放。
            */
            background-size: 300% 700%; 
            border-bottom: 1px solid #f0f0f0;

            /* 2% 放大容錯，解決白邊問題 */
            transform: scale(1.02);
            transform-origin: center center;
        }

        /* 下半部：資料顯示區 */
        .card-info {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative; 
            z-index: 2;
            background: #fff;
            flex-grow: 1; /* 確保文字少時下方空間填滿 */
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .color-id {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .color-group {
            font-size: 0.75rem;
            font-weight: 700;
            color: #444;
            background: #eaecf0;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            white-space: nowrap; /* 防止群組名稱換行 */
        }

        .info-names {
            display: flex;
            flex-direction: column;
        }

        .color-name-zh {
            font-size: 1.1rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 2px;
        }

        .color-name-en {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
        }

        /* --- Utility --- */
        .no-results {
            grid-column: 1 / -1;
            padding: 80px;
            text-align: center;
            background: #fff;
            border-radius: 12px;
            color: #666;
            font-size: 1.2rem;
        }

        /* --- Responsive Design (Mobile Optimization) --- */
        /* 當寬度小於 900px 時 (涵蓋平板與手機) */
        @media (max-width: 900px) {
            body {
                padding: 20px 10px; /* 減少外部間距 */
            }

            header {
                padding: 16px;
                margin-bottom: 20px;
            }

            h1 {
                font-size: 1.4rem;
            }
            
            .search-wrapper {
                max-width: 100%; /* 搜尋框滿寬 */
            }

            /* --- 手機版雙欄核心設定 --- */
            .color-grid {
                /* 強制改為 2 欄，比例 1:1，自動填滿 */
                grid-template-columns: repeat(2, 1fr); 
                gap: 10px; /* 縮小卡片間距 */
            }

            .card-info {
                padding: 10px 12px; /* 縮小內部間距 */
                gap: 4px;
            }

            .color-id {
                font-size: 1.1rem; /* 縮小編號字體 */
            }

            .color-group {
                font-size: 0.65rem;
                padding: 2px 6px;
            }

            .color-name-zh {
                font-size: 1rem;
            }

            .color-name-en {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>ShinHan 專家國畫顏料</h1>
        <div class="search-wrapper">
            <div class="search-icon"></div>
            <input type="text" id="searchInput" class="search-input" placeholder="搜尋編號、名稱...">
        </div>
    </header>

    <main>
        <div id="colorGrid" class="color-grid">
            </div>
    </main>

<script>
    const colorData = [
        // 第一排 (Row 0)
        { id: '314', en: 'CRIMSON 1', zh: '臙脂', group: 'C', spriteIndex: 0 },
        { id: '306', en: 'GREEN LIGHT', zh: '若葉', group: 'B', spriteIndex: 1 },
        { id: '328', en: 'RED VIOLET', zh: '牡丹', group: 'D', spriteIndex: 2 },
        // 第二排 (Row 1)
        { id: '309', en: 'CRIMSON 2', zh: '臙脂', group: 'C', spriteIndex: 3 },
        { id: '316', en: 'DARK GREEN', zh: '綠草', group: 'B', spriteIndex: 4 },
        { id: '304', en: 'YELLOW OCHRE', zh: '黃土', group: 'B', spriteIndex: 5 },
        // 第三排 (Row 2)
        { id: '339', en: 'CARMINE', zh: '洋紅', group: 'C', spriteIndex: 6 },
        { id: '307', en: 'ICE GREEN', zh: '綠青', group: 'B', spriteIndex: 7 },
        { id: '303', en: 'BURNT SIENNA', zh: '岱赭', group: 'B', spriteIndex: 8 },
        // 第四排 (Row 3)
        { id: '310', en: 'RED', zh: '洋紅', group: 'A', spriteIndex: 9 },
        { id: '315', en: 'LIGHT BLUE VIOLET', zh: '群白', group: 'A', spriteIndex: 10 },
        { id: '302', en: 'BLACK 1', zh: '黑', group: 'B', spriteIndex: 11 },
        // 第五排 (Row 4)
        { id: '311', en: 'VERMILION', zh: '朱紅', group: 'C', spriteIndex: 12 },
        { id: '312', en: 'ULTRAMARINE BLUE', zh: '群青', group: 'C', spriteIndex: 13 },
        { id: '301', en: 'WHITE', zh: '胡粉', group: 'A', spriteIndex: 14 },
        // 第六排 (Row 5)
        { id: '305', en: 'YELLOW LIGHT', zh: '黃', group: 'B', spriteIndex: 15 },
        { id: '313', en: 'PRUSSIAN BLUE', zh: '紺', group: 'A', spriteIndex: 16 },
        { id: '350', en: 'GOLD', zh: '金', group: 'B', spriteIndex: 17 },
        // 第七排 (Row 6)
        { id: '308', en: 'OPAL GREEN', zh: '白綠', group: 'B', spriteIndex: 18 },
        { id: '327', en: 'VIOLET', zh: '青紫', group: 'D', spriteIndex: 19 }
    ];

    document.addEventListener('DOMContentLoaded', () => {
        const gridContainer = document.getElementById('colorGrid');
        const searchInput = document.getElementById('searchInput');

        // Sprite Config
        // 總共 3 欄 (Columns) 和 7 列 (Rows)
        const TOTAL_COLS = 3;
        const TOTAL_ROWS = 7;

        if (!gridContainer || !searchInput) return;

        /**
         * 計算背景位置 (百分比模式)
         * 這種算法可以適應任何尺寸的卡片寬度 (Responsive)
         */
        const getBackgroundPosition = (index) => {
            const row = Math.floor(index / TOTAL_COLS);
            const col = index % TOTAL_COLS;
            
            // 計算百分比座標
            // X: col / (總欄數 - 1) * 100%
            // Y: row / (總列數 - 1) * 100%
            const x = (col / (TOTAL_COLS - 1)) * 100;
            const y = (row / (TOTAL_ROWS - 1)) * 100;
            
            return `${x}% ${y}%`;
        };

        const renderList = (list) => {
            if (list.length === 0) {
                gridContainer.innerHTML = `
                    <div class="no-results">
                        沒有找到符合 "${searchInput.value}" 的顏料
                    </div>`;
                return;
            }

            const fragment = document.createDocumentFragment();

            list.forEach(color => {
                const bgPos = getBackgroundPosition(color.spriteIndex);
                
                const card = document.createElement('article');
                card.className = 'color-card';
                
                card.innerHTML = `
                    <div class="card-visual" style="background-position: ${bgPos};" title="${color.zh}"></div>
                    <div class="card-info">
                        <div class="info-header">
                            <span class="color-id">${color.id}</span>
                            <span class="color-group">${color.group}</span>
                        </div>
                        <div class="info-names">
                            <div class="color-name-zh">${color.zh}</div>
                            <div class="color-name-en">${color.en}</div>
                        </div>
                    </div>
                `;
                
                fragment.appendChild(card);
            });

            gridContainer.innerHTML = '';
            gridContainer.appendChild(fragment);
        };

        const handleSearch = (e) => {
            const query = e.target.value.toLowerCase().trim();
            
            const filtered = colorData.filter(item => {
                return (
                    item.id.includes(query) || 
                    item.en.toLowerCase().includes(query) || 
                    item.zh.includes(query)
                );
            });

            renderList(filtered);
        };

        renderList(colorData);
        searchInput.addEventListener('input', handleSearch);
    });
</script>

</body>
</html>
